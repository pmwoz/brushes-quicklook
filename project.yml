name: BrushesQuickLook
options:
  bundleIdPrefix: pl.esdesign.brushesquicklook
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # Ad-hoc Debug signing drops the hardened runtime without this.
    OTHER_CODE_SIGN_FLAGS: --options runtime
    DEVELOPMENT_TEAM: ""
    # An ad-hoc signed appex cannot load the Debug-only split dylib.
    ENABLE_DEBUG_DYLIB: NO
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
settingGroups:
  brushkitFFI:
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/ffi/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/ffi/target/universal
    OTHER_LDFLAGS: -lbrushkit_ffi
aggregateTargets:
  BrushkitFFI:
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    buildScripts:
      - name: Build Brushkit FFI
        script: '"$SRCROOT/ffi/build.sh"'
        basedOnDependencyAnalysis: false
targets:
  BrushesQuickLook:
    type: application
    platform: macOS
    sources: [App, Viewer, Shared]
    settings:
      groups: [brushkitFFI]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.esdesign.brushesquicklook
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Alternate keeps Photoshop and Procreate as the default apps for these files.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Photoshop Brush Pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [pl.esdesign.brushesquicklook.abr]
          - CFBundleTypeName: Procreate Brush Set
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [pl.esdesign.brushesquicklook.brushset]
          - CFBundleTypeName: Procreate Brush
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [pl.esdesign.brushesquicklook.brush]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: pl.esdesign.brushesquicklook.abr
            UTTypeDescription: Photoshop Brush Pack
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [abr]
          - UTTypeIdentifier: pl.esdesign.brushesquicklook.brushset
            UTTypeDescription: Procreate Brush Set
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [brushset]
          - UTTypeIdentifier: pl.esdesign.brushesquicklook.brush
            UTTypeDescription: Procreate Brush
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [brush]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - target: BrushkitFFI
      - target: BrushesPreview
        embed: true
      - target: BrushesThumbnail
        embed: true
  BrushesPreview:
    type: app-extension
    platform: macOS
    sources: [Preview, Viewer, Shared]
    settings:
      groups: [brushkitFFI]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.esdesign.brushesquicklook.preview
    info:
      path: Preview/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [pl.esdesign.brushesquicklook.abr, pl.esdesign.brushesquicklook.brushset, pl.esdesign.brushesquicklook.brush]
            QLSupportsSearchableItems: false
    entitlements:
      path: Preview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
    dependencies:
      - target: BrushkitFFI
  BrushesThumbnail:
    type: app-extension
    platform: macOS
    sources: [Thumbnail, Shared]
    settings:
      groups: [brushkitFFI]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.esdesign.brushesquicklook.thumbnail
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [pl.esdesign.brushesquicklook.abr, pl.esdesign.brushesquicklook.brushset, pl.esdesign.brushesquicklook.brush]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: Thumbnail/Thumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
    dependencies:
      - target: BrushkitFFI
  BrushesPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Preview
        excludes: ["*.plist", "*.entitlements"]
      - path: Thumbnail
        excludes: ["*.plist", "*.entitlements"]
      - path: Viewer
      - path: Shared
      - path: ffi/tests/corpus/preview_brush/root_brush
        buildPhase: resources
      - path: ffi/tests/corpus/preview_brush/missing_shape
        buildPhase: resources
      - path: ffi/tests/corpus/preview_brush/oversized_png
        buildPhase: resources
      - path: ffi/tests/corpus/preview_brushset/ordered_set
        buildPhase: resources
      - path: ffi/tests/corpus/preview_abr/zero_area_tip
        buildPhase: resources
    settings:
      groups: [brushkitFFI]
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pl.esdesign.brushesquicklook.preview.tests
    dependencies:
      - target: BrushkitFFI
schemes:
  BrushesPreviewTests:
    build:
      targets:
        BrushesPreviewTests: all
    test:
      targets: [BrushesPreviewTests]
