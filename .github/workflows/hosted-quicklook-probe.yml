name: Hosted Quick Look probe

on:
  push:
    branches: [prototype/hosted-quicklook-probe]

permissions:
  contents: read

env:
  BQL: .claude/skills/verify-brushes-quicklook/bql

jobs:
  hostile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: brew install xcodegen
      - name: Build Release and register with lsregister and pluginkit
        run: $BQL install
      - run: $BQL doctor
      - run: $BQL fixtures
      - name: Hostile sweep over ffi/tests/corpus
        run: $BQL hostile
      - name: Copy crash reports
        if: always()
        run: mkdir -p crashes && cp ~/Library/Logs/DiagnosticReports/Brushes* crashes/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hostile-evidence
          path: |
            build.noindex/verify/evidence
            crashes

  crash-drill:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: brew install xcodegen
      - run: $BQL install
      - run: $BQL fixtures
      - name: Hostile sweep fails when the preview extension crashes
        run: |
          (for i in $(seq 1 600); do
             pid=$(pgrep -x BrushesPreview) && { sleep 0.5; kill -SEGV $pid; echo "drill: SIGSEGV to $pid" >&2; break; }
             sleep 0.1
           done) &
          set +e
          $BQL hostile build.noindex/verify/fixtures/corpus/ordered_set.brushset > drill.json
          code=$?
          set -e
          cat drill.json
          ls -la ~/Library/Logs/DiagnosticReports
          echo "hostile exit $code"
          test "$code" -eq 1
          grep -Eq '"crashed": [1-9]' drill.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drill-evidence
          path: drill.json
