name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Test bql
        run: /usr/bin/python3 -m unittest discover -s .claude/skills/verify-brushes-quicklook -p 'test_*.py' -v
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Build FFI with Xcode GUI environment
        run: env -i HOME="$HOME" ARCHS=arm64 PATH=/usr/bin:/bin:/usr/sbin:/sbin ffi/build.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Lint FFI
        run: cargo clippy --manifest-path ffi/Cargo.toml --all-targets -- -D warnings
      - name: Test FFI
        run: cargo test --manifest-path ffi/Cargo.toml
      - name: Check fuzz corpus
        run: scripts/check-corpus.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Debug
        run: xcodebuild -project BrushesQuickLook.xcodeproj -scheme BrushesQuickLook -configuration Debug -derivedDataPath build.noindex build
      - name: Test preview
        run: xcodebuild -project BrushesQuickLook.xcodeproj -scheme BrushesPreviewTests -configuration Debug -derivedDataPath build.noindex test
      - name: Build Release
        run: xcodebuild -project BrushesQuickLook.xcodeproj -scheme BrushesQuickLook -configuration Release ONLY_ACTIVE_ARCH=NO -derivedDataPath build.noindex build
      - name: Check Release app
        run: scripts/check-build.sh build.noindex/Build/Products/Release/BrushesQuickLook.app
      - name: Install app
        run: .claude/skills/verify-brushes-quicklook/bql install
      - name: Copy fixtures
        run: .claude/skills/verify-brushes-quicklook/bql fixtures
      - name: Hostile sweep
        run: .claude/skills/verify-brushes-quicklook/bql hostile
      - name: Copy crash reports
        if: always()
        run: mkdir -p build.noindex/verify/evidence/crash-reports && cp ~/Library/Logs/DiagnosticReports/Brushes* build.noindex/verify/evidence/crash-reports/ 2>/dev/null || true
      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hostile-evidence
          path: build.noindex/verify/evidence
