name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Intel Rust target
        run: rustup target add x86_64-apple-darwin
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Lint FFI
        run: cargo clippy --manifest-path ffi/Cargo.toml --all-targets -- -D warnings
      - name: Test FFI
        run: cargo test --manifest-path ffi/Cargo.toml
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Debug
        run: xcodebuild -project BrushesQuickLook.xcodeproj -scheme BrushesQuickLook -configuration Debug -derivedDataPath build.noindex build
      - name: Test preview
        run: xcodebuild -project BrushesQuickLook.xcodeproj -scheme BrushesPreviewTests -configuration Debug -derivedDataPath build.noindex test
      - name: Build Release
        run: xcodebuild -project BrushesQuickLook.xcodeproj -scheme BrushesQuickLook -configuration Release ONLY_ACTIVE_ARCH=NO -derivedDataPath build.noindex build
      - name: Check Release app
        run: scripts/check-build.sh build.noindex/Build/Products/Release/BrushesQuickLook.app
